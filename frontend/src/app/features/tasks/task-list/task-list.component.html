<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>My Tasks</h2>
    <button class="btn btn-outline-secondary btn-sm" (click)="logout()">Log Out</button>
  </div>

  <div class="row mb-3 g-2">
    <div class="col-md-5">
      <input
        type="text"
        class="form-control"
        placeholder="Search tasks..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)">
    </div>

    <div class="col-md-4">
      <select class="form-select" [(ngModel)]="selectedCategoryId" (ngModelChange)="onCategoryFilterChange()">
        <option [ngValue]="null">All categories</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <div class="col-md-3 d-flex gap-2">
      <button class="btn btn-primary flex-fill" (click)="openCreateForm()">+ New Task</button>
      <button class="btn btn-outline-secondary" (click)="showCategoryManager = true">Categories</button>
    </div>
  </div>

  <div class="list-group mb-3">
    <div *ngFor="let task of tasks" class="list-group-item d-flex align-items-center gap-3">
      <input type="checkbox" class="form-check-input" [checked]="task.isCompleted" (change)="toggleComplete(task)">

      <div class="flex-grow-1">
        <div [class.text-decoration-line-through]="task.isCompleted" [class.text-muted]="task.isCompleted">
          <strong>{{ task.title }}</strong>
        </div>
        <small class="text-muted" *ngIf="task.description">{{ task.description }}</small>
        <div>
          <span class="badge bg-secondary" *ngIf="task.categoryName">{{ task.categoryName }}</span>
          <span class="badge bg-light text-dark" *ngIf="task.dueDate">Due: {{ task.dueDate | date:'shortDate' }}</span>
        </div>
      </div>

      <button class="btn btn-sm btn-outline-primary" (click)="openEditForm(task)">Edit</button>
      <button class="btn btn-sm btn-outline-danger" (click)="deleteTask(task.id)">Delete</button>
    </div>

    <div *ngIf="tasks.length === 0" class="list-group-item text-center text-muted py-4">
      No tasks found.
    </div>
  </div>

  <nav *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="pageNumber === 1">
        <a class="page-link" (click)="goToPage(pageNumber - 1)" style="cursor: pointer;">Previous</a>
      </li>
      <li class="page-item" *ngFor="let page of pageNumbers" [class.active]="page === pageNumber">
        <a class="page-link" (click)="goToPage(page)" style="cursor: pointer;">{{ page }}</a>
      </li>
      <li class="page-item" [class.disabled]="pageNumber === totalPages">
        <a class="page-link" (click)="goToPage(pageNumber + 1)" style="cursor: pointer;">Next</a>
      </li>
    </ul>
  </nav>

  <app-task-form
    *ngIf="showTaskForm"
    [task]="editingTask"
    [categories]="categories"
    (closed)="onFormClosed($event)">
  </app-task-form>

  <app-category-manager
    *ngIf="showCategoryManager"
    (closed)="onCategoryManagerClosed($event)">
  </app-category-manager>
</div>
