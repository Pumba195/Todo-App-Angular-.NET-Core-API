<div class="modal-backdrop-custom" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h4>{{ isEditMode ? 'Edit Task' : 'New Task' }}</h4>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control" formControlName="title">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" formControlName="description" rows="2"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Due Date</label>
        <input type="date" class="form-control" formControlName="dueDate">
      </div>

      <div class="mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" formControlName="categoryId">
          <option [ngValue]="null">No category</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
        </select>
      </div>

      <div class="form-check mb-3" *ngIf="isEditMode">
        <input type="checkbox" class="form-check-input" formControlName="isCompleted" id="isCompletedCheck">
        <label class="form-check-label" for="isCompletedCheck">Completed</label>
      </div>

      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSaving">
          {{ isSaving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
