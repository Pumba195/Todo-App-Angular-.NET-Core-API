<div class="modal-backdrop-custom" (click)="close()">
  <div class="modal-card card shadow" (click)="$event.stopPropagation()">
    <div class="card-body">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold">Manage Categories</h5>
        <button class="btn-close" (click)="close()"></button>
      </div>

      <div class="d-flex gap-2 mb-3">
        <input type="text" class="form-control" placeholder="New category name" [(ngModel)]="newCategoryName"
          (keyup.enter)="addCategory()">
        <button class="btn btn-primary" (click)="addCategory()">Add</button>
      </div>
      @if (errorMessage) {
      <div class="text-danger small mb-3">{{ errorMessage }}</div>
      }

      <ul class="list-group mb-3">
        @for (cat of categories; track cat) {
        <li class="list-group-item d-flex align-items-center gap-2">
          <span class="category-dot"></span>
          <span class="category-name flex-grow-1">{{ cat.name }}</span>
          <button class="btn btn-sm btn-outline-danger" (click)="requestDeleteCategory(cat.id)">🗑</button>
        </li>
        }
        @if (categories.length === 0) {
        <li class="list-group-item text-center text-muted">
          No categories yet.
        </li>
        }
      </ul>

      <div>
        <button class="btn btn-outline-secondary w-100" (click)="close()">Close</button>
      </div>

    </div>

    @if (showDeleteConfirm) {
    <app-confirm-dialog title="Delete this category?" message="Tasks using it will become uncategorized."
      (confirmed)="onDeleteConfirmed($event)">
    </app-confirm-dialog>
    }
  </div>
</div>
